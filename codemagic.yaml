workflows:
  ios-testflight:
    name: LifeDock iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials # add in Codemagic UI: APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.lifedock.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
          include_glob_notify_only: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Generate app icons and splash screens
        script: |
          npm run assets:generate
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing certificates and provisioning profiles
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          app-store-connect list-builds || true
          keychain add-certificates
          xcode-project use-profiles
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Increment build number
        script: |
          cd ios/App && agvtool new-version -all "$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" | awk '{print $1+1}')"
      - name: Build and archive
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
