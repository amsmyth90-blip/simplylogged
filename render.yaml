services:
  - type: pserv
    name: diarydock-clamav
    runtime: image
    region: frankfurt
    plan: 1c-2g
    numInstances: 2
    image:
      url: docker.io/clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591

  - type: web
    name: diarydock-malware-scanner
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    numInstances: 2
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./services/malware-scanner/Dockerfile
    dockerContext: ./services/malware-scanner
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DIARYDOCK_SCANNER_REQUEST_TOKEN
        sync: false
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: diarydock-clamav
          property: host
      - key: CLAMAV_PORT
        value: "3310"
      - key: SCANNER_MAXIMUM_BYTES
        value: "12582912"
      - key: SCANNER_TIMEOUT_MS
        value: "30000"
